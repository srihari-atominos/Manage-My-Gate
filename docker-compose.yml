services:
  mongodb:
    image: mongo:latest
    container_name: mmg-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-manageadmin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-ManageAdminPwd@123}
      - TZ=${TZ:-Asia/Kolkata}
    ports:
      - "${DB_PORT_EXTERNAL:-27019}:27017"
    volumes:
      - mongodb_data:/data/db
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/db/replica.key ]; then
          openssl rand -base64 756 > /data/db/replica.key
          chmod 400 /data/db/replica.key
          chown 999:999 /data/db/replica.key 2>/dev/null || true
        fi
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/db/replica.key
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      mmg-network:
        aliases:
          - mongo
          - mongodb

  mongodb-rs-init:
    image: mongo:latest
    container_name: mmg-mongodb-rs-init
    environment:
      - TZ=${TZ:-Asia/Kolkata}
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mongosh --host mongodb:27017 -u "${MONGO_ROOT_USER:-manageadmin}" -p "${MONGO_ROOT_PASSWORD:-ManageAdminPwd@123}" --authenticationDatabase admin --eval 'print("ready")' > /dev/null 2>&1 || mongosh --host mongodb:27017 --eval 'print("ready")' > /dev/null 2>&1; do sleep 1; done
        mongosh --host mongodb:27017 -u "${MONGO_ROOT_USER:-manageadmin}" -p "${MONGO_ROOT_PASSWORD:-ManageAdminPwd@123}" --authenticationDatabase admin --eval "try { rs.initiate({ _id: 'rs0', members: [ { _id: 0, host: 'mongodb:27017' } ] }) } catch (e) { print(e.message) }" || mongosh --host mongodb:27017 --eval "try { rs.initiate({ _id: 'rs0', members: [ { _id: 0, host: 'mongodb:27017' } ] }) } catch (e) { print(e.message) }"
    networks:
      - mmg-network

  redis:
    image: redis:alpine
    container_name: mmg-redis
    ports:
      - "${REDIS_PORT_EXTERNAL:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mmg-network

  backend:
    image: ${DOCKER_REGISTRY:-atocash}/manage-my-gate-server:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mmg-backend
    ports:
      - "${SERVER_PORT:-5006}:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - MONGODB_URI=${MONGODB_URI:-mongodb://manageadmin:ManageAdminPwd%40123@mongodb:27017/manage_my_gate_prod?replicaSet=rs0&authSource=admin}
      - JWT_SECRET=${JWT_SECRET:-f6dd9f23c0dec5698e7f0fc7e0d2f4dbaba4dcd5e58e9935d6ef5ff5d8fc9f9c}
      - SESSION_SECRET=${SESSION_SECRET:-HSGEtCoNdLyEuHCrFOrzFGmyxbkHYLtBbO8QmCYQPxI=}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-ysgGTR13/fkLIqmJKRuGmmpzYg2vrzUnqYMg8zIol1g=}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-srihari@atominosconsulting.com}
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-superadmin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-2@TestPassword}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your_google_client_id_here}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-your_google_client_secret_here}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-your_microsoft_client_id_here}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-your_microsoft_tenant_id_here}
      - CLIENT_URL=${CLIENT_URL:-https://managemygate.e3esg.com}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://managemygate.e3esg.com,http://localhost:3004,http://localhost:3000,http://127.0.0.1:3004,http://127.0.0.1:3000}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NODE_ENV=${NODE_ENV:-production}
      - TZ=${TZ:-Asia/Kolkata}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mmg-network

  frontend:
    image: ${DOCKER_REGISTRY:-atocash}/manage-my-gate-client:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your_google_client_id_here}
        - VITE_MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-your_microsoft_client_id_here}
        - VITE_MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID:-your_microsoft_tenant_id_here}
    container_name: mmg-frontend
    ports:
      - "${CLIENT_PORT:-3004}:80"
    environment:
      - TZ=${TZ:-Asia/Kolkata}
    depends_on:
      - backend
    networks:
      - mmg-network

  mongo-express:
    image: mongo-express:latest
    container_name: mmg-mongo-express
    restart: always
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USER:-manageadmin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD:-ManageAdminPwd@123}
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_BASICAUTH_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_BASICAUTH_PASS:-admin123}
      - ME_CONFIG_SITE_BASEURL=${ME_CONFIG_SITE_BASEURL:-}
      - TZ=${TZ:-Asia/Kolkata}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mmg-network

volumes:
  mongodb_data:

networks:
  mmg-network:
    driver: bridge
