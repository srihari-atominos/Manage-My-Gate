server {
    listen 80;
    server_name api.yourdomain.com; # Replace with your live backend domain

    location / {
        proxy_pass http://localhost:5002; # Or your backend port
        
        # Standard HTTP Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addres_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL FOR WEBSOCKETS (SOCKET.IO)
        # This tells Nginx to upgrade the HTTP connection to a continuous WebSocket connection
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Increase timeouts so Nginx doesn't drop idle socket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
