map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name managemygate.e3esg.com; # Replace with your live domain

    # Serve Frontend & Proxy Socket/API
    location / {
        proxy_pass http://localhost:3004; # Port mapped to mmg-frontend container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL FOR WEBSOCKETS (SOCKET.IO)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Increase timeouts so Nginx doesn't drop idle socket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
