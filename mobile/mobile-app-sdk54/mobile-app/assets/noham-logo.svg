<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1723"/>
      <stop offset="50%" stop-color="#09101A"/>
      <stop offset="100%" stop-color="#040910"/>
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17BE74"/>
      <stop offset="50%" stop-color="#0F886F"/>
      <stop offset="100%" stop-color="#044C10"/>
    </linearGradient>

    <!-- Cyan Accent Glow Gradient -->
    <linearGradient id="cyanGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1CABCE"/>
      <stop offset="100%" stop-color="#17BE74"/>
    </linearGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17BE74" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#044C10" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Slate Background Canvas -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="24"/>

  <!-- Subtle Ambient Tech Grid Lines -->
  <g opacity="0.05" stroke="#1CABCE" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- LOGO MARK / EMBLEM CONTAINER (Centered at X: 400, Y: 210) -->
  <g transform="translate(400, 210)">
    <!-- Outer Shield / Gateway Protective Arch -->
    <path d="M 0 -130 
             C 70 -130, 110 -100, 110 -20 
             C 110 60, 50 110, 0 135 
             C -50 110, -110 60, -110 -20 
             C -110 -100, -70 -130, 0 -130 Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#cyanGlowGrad)" 
          stroke-width="3" 
          opacity="0.85"/>

    <!-- Inner Protective Arch Border -->
    <path d="M 0 -115 
             C 55 -115, 90 -90, 90 -20 
             C 90 48, 40 90, 0 112 
             C -40 90, -90 48, -90 -20 
             C -90 -90, -55 -115, 0 -115 Z" 
          fill="none" 
          stroke="#17BE74" 
          stroke-width="1.5" 
          stroke-dasharray="6,4"
          opacity="0.6"/>

    <!-- STYLIZED 'N' MONOGRAM INTEGRATED WITH GATE ARCH -->
    <!-- Left Vertical Pillar of 'N' -->
    <path d="M -50 50 L -50 -60 L -30 -60 L -30 50 Z" 
          fill="url(#emeraldGrad)" 
          filter="url(#neonGlow)"/>

    <!-- Diagonal Connected Tech Bridge of 'N' -->
    <path d="M -35 -50 L 35 40 L 50 40 L -20 -70 Z" 
          fill="url(#cyanGlowGrad)"/>

    <!-- Right Vertical Pillar of 'N' -->
    <path d="M 30 -50 L 30 60 L 50 60 L 50 -50 Z" 
          fill="url(#emeraldGrad)" 
          filter="url(#neonGlow)"/>

    <!-- Central Smart Access Node Diamond -->
    <polygon points="0,-15 15,0 0,15 -15,0" fill="#FFFFFF" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="4" fill="#1CABCE"/>

    <!-- Top Crown Gateway Arc -->
    <path d="M -30 -90 Q 0 -110 30 -90" fill="none" stroke="#1CABCE" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- TYPOGRAPHY SECTION: "NOHAM" -->
  <g transform="translate(400, 420)">
    <!-- Main Brand Name -->
    <text x="0" y="0" 
          font-family="'Red Hat Display', 'Poppins', 'Montserrat', sans-serif" 
          font-size="64" 
          font-weight="800" 
          letter-spacing="12" 
          text-anchor="middle" 
          fill="#FFFFFF" 
          filter="url(#neonGlow)">
      NOHAM
    </text>

    <!-- Subtle Cyan Accent Line under Name -->
    <rect x="-120" y="16" width="240" height="3" rx="1.5" fill="url(#cyanGlowGrad)"/>
    <circle cx="0" cy="17.5" r="4" fill="#17BE74"/>

    <!-- Tagline / Subtitle -->
    <text x="0" y="48" 
          font-family="'Poppins', sans-serif" 
          font-size="14" 
          font-weight="500" 
          letter-spacing="6" 
          text-anchor="middle" 
          fill="#17BE74" 
          opacity="0.9">
      SMART COMMUNITY ECOSYSTEM
    </text>
  </g>

  <!-- Atominos Branding Reference Ribbon -->
  <g transform="translate(400, 550)">
    <text x="0" y="0" 
          font-family="'Poppins', sans-serif" 
          font-size="11" 
          font-weight="400" 
          letter-spacing="2" 
          text-anchor="middle" 
          fill="#1CABCE" 
          opacity="0.5">
      POWERED BY ATOMINOS CONSULTING THEME
    </text>
  </g>
</svg>
