name: ManageMyGate CI Pipeline

on:
  push:
    branches: [ main, develop, test/develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Regression & Verification Harness
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Invitation & Security Verification Harness
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/manage_my_gate_ci
          JWT_SECRET: ci_secret_key_12345
          SESSION_SECRET: ci_session_secret_key_12345
          ENCRYPTION_KEY: ci_encryption_key_12345
          PORT: 5002
          HOST: 127.0.0.1
        run: |
          node backend/tests/verify_invitation_flow.js

  mobile-checks:
    name: Mobile TypeScript & Jest Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: mobile/mobile-app/package-lock.json

      - name: Install mobile dependencies
        run: |
          cd mobile/mobile-app
          npm ci

      - name: Run Mobile TypeScript Check
        run: |
          cd mobile/mobile-app
          npx tsc --noEmit

      - name: Run Mobile Jest Test Suite
        run: |
          cd mobile/mobile-app
          npm test
